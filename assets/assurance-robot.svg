<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="robot-title robot-desc">
  <title id="robot-title">A humanoid robot carrying a changed load</title>
  <desc id="robot-desc">Technical line illustration of a complete humanoid robot supporting a small block in its right hand. A dashed outline marks its operating boundary, and a circular change symbol identifies the new load.</desc>

  <!-- Operating envelope and floor. -->
  <path d="M65 225V42a16 16 0 0 1 16-16h216a16 16 0 0 1 16 16v183"
        fill="none" stroke="#aabbb0" stroke-width="1.25" stroke-dasharray="5 6"/>
  <path d="M31 246h298" fill="none" stroke="#9daf9f" stroke-width="1.5"/>
  <path d="M91 253h145" fill="none" stroke="#dce3de" stroke-width="1"/>

  <!-- Limbs are assembled from links, joints and foot plates. -->
  <g stroke="#174b43" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="m140 163-9 32 13 6 12-34z" fill="#e2eae1"/>
    <path d="m133 207-6 28 12 2 10-29z" fill="#eef2e9"/>
    <circle cx="140" cy="202" r="9" fill="#fcfcfa"/>
    <circle cx="140" cy="202" r="3" fill="#aabbb0" stroke="none"/>
    <path d="m124 236-12 5v5h34v-6l-9-4z" fill="#e2eae1"/>
    <path d="M118 242h22" fill="none" stroke="#586761" stroke-width="1"/>

    <path d="m170 166 11 35 15-6-11-32z" fill="#eef2e9"/>
    <path d="m183 208 7 28 13-2-5-29z" fill="#e2eae1"/>
    <circle cx="190" cy="202" r="9" fill="#fcfcfa"/>
    <circle cx="190" cy="202" r="3" fill="#aabbb0" stroke="none"/>
    <path d="m190 236-4 6v4h36v-5l-19-5z" fill="#eef2e9"/>
    <path d="M192 242h23" fill="none" stroke="#586761" stroke-width="1"/>

    <path d="m112 99-8 32 13 4 11-31z" fill="#e2eae1"/>
    <path d="m103 145 5 29 12-2-3-29z" fill="#eef2e9"/>
    <circle cx="110" cy="138" r="9" fill="#fcfcfa"/>
    <circle cx="110" cy="138" r="3" fill="#aabbb0" stroke="none"/>
    <path d="m110 175 1 10 7 5 4-2-5-7 4-2 5 5 3-3-7-10z" fill="#e2eae1"/>

    <path d="m208 92 22 21-9 12-24-22z" fill="#e2eae1"/>
    <path d="m234 123 19 20-8 9-23-18z" fill="#eef2e9"/>
    <circle cx="229" cy="123" r="9" fill="#fcfcfa"/>
    <circle cx="229" cy="123" r="3" fill="#aabbb0" stroke="none"/>
    <path d="m250 143 9 7h18v6h-23l-10-7z" fill="#e2eae1"/>
    <path d="M275 150v-7h5v12" fill="none"/>

    <!-- Pelvis, torso and shoulder assemblies. -->
    <path d="M139 146h43l6 17-12 11h-27l-15-11z" fill="#e2eae1"/>
    <path d="M149 146v-9h24v9" fill="#fcfcfa"/>
    <circle cx="120" cy="93" r="12" fill="#fcfcfa"/>
    <circle cx="120" cy="93" r="4" fill="#aabbb0" stroke="none"/>
    <circle cx="201" cy="93" r="12" fill="#fcfcfa"/>
    <circle cx="201" cy="93" r="4" fill="#aabbb0" stroke="none"/>
    <path d="m137 78 45 0 13 14-10 43-15 8h-20l-15-8-10-43z" fill="#eef2e9"/>
    <path d="m143 89 34 0 7 10-5 19h-38l-5-19z" fill="#fcfcfa" stroke="#9daf9f" stroke-width="1.1"/>
    <path d="M149 126h23M151 131h19" fill="none" stroke="#586761" stroke-width="1"/>
    <circle cx="160" cy="103" r="4" fill="#174b43" stroke="none"/>
    <path d="M150 157h21" fill="none" stroke="#586761" stroke-width="1"/>

    <!-- Neck and a compact sensor head. -->
    <path d="M153 68v10h15V68" fill="#e2eae1"/>
    <path d="M146 37h29l7 7v20l-7 7h-29l-7-7V44z" fill="#eef2e9"/>
    <rect x="145" y="47" width="31" height="11" rx="2" fill="#174b43" stroke="none"/>
    <circle cx="168" cy="52.5" r="2.8" fill="#fcfcfa" stroke="none"/>
    <path d="M150 64h20" fill="none" stroke="#586761" stroke-width="1"/>
  </g>

  <!-- A new payload is supported by the right gripper. -->
  <g stroke="#174b43" stroke-width="1.5" stroke-linejoin="round">
    <path d="m253 116 13-8h29l-13 8z" fill="#d2dfcf"/>
    <path d="M253 116h29v30h-29z" fill="#e2eadb"/>
    <path d="m282 116 13-8v30l-13 8z" fill="#bccfbb"/>
    <path d="M260 123h15M260 128h10" fill="none" stroke="#849d87" stroke-width="1"/>
  </g>

  <!-- The change marker uses arrows rather than text. -->
  <path d="M284 90v13" fill="none" stroke="#849d87" stroke-width="1.1" stroke-dasharray="3 3"/>
  <circle cx="284" cy="74" r="16" fill="#f2f5ef"/>
  <g fill="none" stroke="#586761" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M277 70a8 8 0 0 1 14 0m-4-1 4 1 1-4"/>
    <path d="M291 78a8 8 0 0 1-14 0m4 1-4-1-1 4"/>
  </g>
</svg>
